<script>
  const PERKS = [
    { name: "Blackbird", maxTier: 0, weight: 1 },
    { name: "Blueshell", maxTier: 0, weight: 1 },
    { name: "Charred Dice", maxTier: 0, weight: 1 },
    { name: "Clairvoyant", maxTier: 0, weight: 1 },
    { name: "Clean Slate", maxTier: 0, weight: 1 },
    { name: "Compound Interest", maxTier: 0, weight: 1 },
    { name: "Deadlineduel", maxTier: 0, weight: 1 },
    { name: "Devil Deal", maxTier: 0, weight: 3 },

    { name: "Dicey Fortune", maxTier: 2, weight: 1 },
    { name: "Fuck Off", maxTier: 1, weight: 1 },

    { name: "ICBA", maxTier: 2, weight: 1 },
    { name: "Master of Fate", maxTier: 1, weight: 1 },
    { name: "Momentum Multiplier", maxTier: 2, weight: 1 },

    { name: "Noob Tube", maxTier: 0, weight: 1 },

    { name: "Perkaholic", maxTier: 2, weight: 1 },

    { name: "Perk Purge", maxTier: 0, weight: 1 },
    { name: "Perk Purification", maxTier: 0, weight: 1 },

    { name: "Phantom Roll", maxTier: 0, weight: 1 },
    { name: "Relic of the Past", maxTier: 0, weight: 1 },

    { name: "Reset Rhythm", maxTier: 2, weight: 1 },

    { name: "Saboteur’s Gambit", maxTier: 0, weight: 1 },
    { name: "Scorched Earth", maxTier: 0, weight: 1 },
    { name: "Score Spike", maxTier: 0, weight: 1 },
    { name: "Streaking", maxTier: 2, weight: 1 },
    { name: "Task Overflow", maxTier: 0, weight: 2 },

    { name: "Token of Immunity", maxTier: 0, weight: 1 },
    { name: "Token Taker", maxTier: 0, weight: 1 },
    { name: "Unlucky Charm", maxTier: 0, weight: 1 },
  ];

  const LS_TIERS = "perkroller_locked_tiers_v5";
  const LS_LOG   = "perkroller_locked_log_v5";

  const el = (id) => document.getElementById(id);
  const nowString = () => new Date().toLocaleString();

  let lastRolled = [];

  function toast(msg){
    const t = el("toast");
    if (!t) return;
    t.textContent = msg;
    t.style.display = "block";
    clearTimeout(toast._timer);
    toast._timer = setTimeout(()=>{ t.style.display="none"; }, 1600);
  }

  function escapeHtml(s){
    return String(s)
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;")
      .replaceAll('"',"&quot;")
      .replaceAll("'","&#039;");
  }

  function loadJson(key, fallback){
    try{
      const raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : fallback;
    }catch{
      return fallback;
    }
  }
  function saveJson(key, value){
    localStorage.setItem(key, JSON.stringify(value));
  }

  function normalizeTiers(){
    const tiers = loadJson(LS_TIERS, {});
    const names = new Set(PERKS.map(p => p.name));

    for (const p of PERKS){
      if (p.maxTier > 0){
        if (!(p.name in tiers)) tiers[p.name] = null;
        const v = tiers[p.name];
        if (typeof v === "number"){
          if (v < 1) tiers[p.name] = null;
          if (v > p.maxTier) tiers[p.name] = p.maxTier;
        }
      } else {
        if (p.name in tiers) delete tiers[p.name];
      }
    }
    for (const k of Object.keys(tiers)){
      if (!names.has(k)) delete tiers[k];
    }
    saveJson(LS_TIERS, tiers);
    return tiers;
  }

  function weightedPick(items){
    const total = items.reduce((s,it)=>s+it.weight,0);
    let r = Math.random() * total;
    for (const it of items){
      r -= it.weight;
      if (r <= 0) return it;
    }
    return items[items.length - 1];
  }

  // your naming: momentummultiplier_t0.png
  function slugifyForYourFiles(name){
    return name
      .toLowerCase()
      .normalize("NFKD")
      .replace(/[\u2019\u2018]/g, "'")
      .replace(/'/g, "")
      .replace(/[^a-z0-9]/g, "");
  }

  function imagePathFor(perk, tiers){
    const slug = slugifyForYourFiles(perk.name);
    let t = 0;
    if (perk.maxTier > 0){
      const cur = (tiers[perk.name] ?? null);
      t = (cur === null) ? 0 : Number(cur);
    }
    return `images/${slug}_t${t}.png`;
  }

  function tierLabel(perk, tiers){
    if (perk.maxTier <= 0) return "t0";
    const cur = (tiers[perk.name] ?? null);
    return (cur === null) ? "t0" : `t${cur}`;
  }

  function renderStats(){
    const stats = el("statsBox");
    if (stats) stats.textContent = `Perks: ${PERKS.length}`;
  }

  function renderPerks(){
    const tiers = normalizeTiers();
    const q = (el("search")?.value || "").trim().toLowerCase();

    const body = el("perkBody");
    if (!body) return;
    body.innerHTML = "";

    for (const p of PERKS){
      if (q && !p.name.toLowerCase().includes(q)) continue;

      let tierCell = "";
      if (p.maxTier <= 0){
        tierCell = `<span class="muted">N/A</span>`;
      } else {
        const cur = tiers[p.name];
        const btns = [];
        btns.push(`<span class="tierBtn ${cur===null ? "active" : ""}" data-perk="${encodeURIComponent(p.name)}" data-tier="">t0</span>`);
        for (let t=1; t<=p.maxTier; t++){
          btns.push(`<span class="tierBtn ${cur===t ? "active" : ""}" data-perk="${encodeURIComponent(p.name)}" data-tier="${t}">t${t}</span>`);
        }
        tierCell = `<div class="tiers">${btns.join("")}</div>`;
      }

      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td><b>${escapeHtml(p.name)}</b></td>
        <td>${p.maxTier}</td>
        <td>${p.weight}</td>
        <td>${tierCell}</td>
      `;
      body.appendChild(tr);
    }
  }

  function renderLog(){
    const log = loadJson(LS_LOG, []);
    if (el("logCount")) el("logCount").textContent = `${log.length} entr${log.length===1?"y":"ies"}`;
    const body = el("logBody");
    if (!body) return;
    body.innerHTML = log.slice().reverse().map(e => `
      <tr>
        <td>${escapeHtml(e.time)}</td>
        <td><b>${escapeHtml(e.perk)}</b></td>
        <td>${escapeHtml(e.tierAtRoll)}</td>
      </tr>
    `).join("");
  }

  function renderRolledImages(rolled){
    const out = el("rollOutput");
    if (!out) return;
    out.innerHTML = "";

    if (!rolled.length){
      out.innerHTML = `<div class="muted">Click Roll 1 / 2 / 3 / 4</div>`;
      return;
    }

    for (const r of rolled){
      const card = document.createElement("div");
      card.className = "rollCard";

      const img = document.createElement("img");
      img.src = r.img;
      img.alt = r.perk.name;

      img.onerror = () => {
        card.innerHTML = `
          <div class="imgMissing">
            Missing image for <b>${escapeHtml(r.perk.name)}</b><br>
            Expected: <code>${escapeHtml(r.img)}</code>
          </div>
        `;
      };

      const meta = document.createElement("div");
      meta.className = "rollMeta";
      meta.innerHTML = `<div><b>${escapeHtml(r.perk.name)}</b><br><span>${escapeHtml(r.tier)}</span></div>`;

      card.appendChild(img);
      card.appendChild(meta);
      out.appendChild(card);
    }
  }

  async function copyLastRollAsSingleImage(){
    if (!navigator.clipboard || !window.ClipboardItem){
      toast("Clipboard image copy not supported (use Chrome/Edge).");
      return;
    }
    if (!lastRolled.length){
      toast("Nothing rolled yet.");
      return;
    }

    try{
      const bitmaps = [];
      for (const r of lastRolled){
        const res = await fetch(r.img, { cache: "no-store" });
        if (!res.ok) throw new Error("Failed to fetch: " + r.img);
        const blob = await res.blob();
        const bmp = await createImageBitmap(blob);
        bitmaps.push(bmp);
      }

      const n = bitmaps.length;
      const cols = (n <= 2) ? n : 2;
      const rows = (n <= 2) ? 1 : Math.ceil(n / 2);

      const gap = 24, pad = 24;

      const cellW = Math.max(...bitmaps.map(b => b.width));
      const cellH = Math.max(...bitmaps.map(b => b.height));

      const canvas = document.createElement("canvas");
      canvas.width = pad*2 + cols*cellW + (cols-1)*gap;
      canvas.height = pad*2 + rows*cellH + (rows-1)*gap;

      const ctx = canvas.getContext("2d");
      ctx.clearRect(0,0,canvas.width,canvas.height);

      for (let i=0; i<n; i++){
        const bmp = bitmaps[i];
        const rr = Math.floor(i / cols);
        const cc = i % cols;

        const x0 = pad + cc*(cellW + gap);
        const y0 = pad + rr*(cellH + gap);

        const scale = Math.min(1, cellW / bmp.width, cellH / bmp.height);
        const dw = Math.floor(bmp.width * scale);
        const dh = Math.floor(bmp.height * scale);

        const dx = x0 + Math.floor((cellW - dw)/2);
        const dy = y0 + Math.floor((cellH - dh)/2);

        ctx.drawImage(bmp, dx, dy, dw, dh);
      }

      const outBlob = await new Promise((resolve) => canvas.toBlob(resolve, "image/png"));
      if (!outBlob) throw new Error("toBlob failed");

      await navigator.clipboard.write([ new ClipboardItem({ "image/png": outBlob }) ]);
      toast("Roll image copied! Paste once into Discord.");
    }catch(err){
      console.error(err);
      toast("Could not copy roll image (try Chrome/Edge).");
    }
  }

  function rollN(nWanted){
    const tiers = normalizeTiers();
    let tempPool = PERKS.slice();
    const n = Math.min(nWanted, tempPool.length);

    const rolled = [];
    const log = loadJson(LS_LOG, []);

    for (let i=0; i<n; i++){
      const picked = weightedPick(tempPool);
      tempPool = tempPool.filter(p => p !== picked);

      const imgPath = imagePathFor(picked, tiers);
      const tier = tierLabel(picked, tiers);

      rolled.push({ perk: picked, img: imgPath, tier });
      log.push({ time: nowString(), perk: picked.name, tierAtRoll: tier });
    }

    saveJson(LS_LOG, log);

    lastRolled = rolled.slice();
    renderRolledImages(rolled);
    renderLog();
  }

  function resetTiers(){
    saveJson(LS_TIERS, {});
    renderPerks();
    toast("Tiers reset.");
  }

  function clearLog(){
    saveJson(LS_LOG, []);
    renderLog();
    toast("Log cleared.");
  }

  function wire(){
    // Tier click delegation
    el("perkBody")?.addEventListener("click", (e) => {
      const btn = e.target.closest(".tierBtn");
      if (!btn) return;

      const perkName = decodeURIComponent(btn.getAttribute("data-perk") || "");
      const tierStr = btn.getAttribute("data-tier"); // "" => t0

      const perk = PERKS.find(p => p.name === perkName);
      if (!perk || perk.maxTier <= 0) return;

      const tiers = normalizeTiers();
      tiers[perkName] = (tierStr === "" ? null : Number(tierStr));
      saveJson(LS_TIERS, tiers);
      renderPerks();
    });

    el("roll1")?.addEventListener("click", () => rollN(1));
    el("roll2")?.addEventListener("click", () => rollN(2));
    el("roll3")?.addEventListener("click", () => rollN(3));
    el("roll4")?.addEventListener("click", () => rollN(4));

    // IMPORTANT: make sure your HTML has a button with id="copyImageBtn"
    el("copyImageBtn")?.addEventListener("click", copyLastRollAsSingleImage);

    el("resetTiersBtn")?.addEventListener("click", resetTiers);
    el("clearLogBtn")?.addEventListener("click", clearLog);
    el("search")?.addEventListener("input", renderPerks);
  }

  // Init
  renderStats();
  renderPerks();
  renderLog();
  renderRolledImages([]);
  wire();
</script>
