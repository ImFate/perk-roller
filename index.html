<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Perk Roller</title>

  <!-- Favicon (put favicon.png next to index.html) -->
  <link rel="icon" type="image/png" href="favicon.png?v=2">

  <style>
    :root{
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial;

      --bg0:#07090c;
      --bg1:#0b0f14;

      --panel: rgba(255,255,255,.045);
      --panel2: rgba(255,255,255,.03);

      --border: rgba(255,255,255,.08);
      --border2: rgba(255,255,255,.14);

      --text:#e8eef7;
      --muted: rgba(232,238,247,.72);

      --y1:#ffff00;
      --y2:#e6e600;

      --r:16px;
    }

    body{
      margin:0;
      color:var(--text);
      background:
        radial-gradient(1000px 600px at 50% 10%, rgba(255,255,255,.06), transparent 60%),
        radial-gradient(900px 600px at 50% 100%, rgba(0,0,0,.55), transparent 60%),
        linear-gradient(180deg, var(--bg0), var(--bg1));
    }

    .topbar{
      padding:14px 18px;
      border-bottom:1px solid rgba(255,255,255,.06);
      background: rgba(0,0,0,.18);
    }

    .wrap{ max-width:1200px; margin:0 auto; padding:18px; }

    h1{ margin:0; font-size:20px; }

    .grid{
      display:grid;
      grid-template-columns: 2fr 1fr;
      gap:14px;
      margin-top:14px;
      align-items:start;
    }

    .card{
      background: linear-gradient(180deg, var(--panel), var(--panel2));
      border:1px solid var(--border);
      border-radius: var(--r);
      padding:14px;
    }

    .row{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
    .row > * { flex:1; }

    input, textarea{
      width:100%;
      box-sizing:border-box;
      background: linear-gradient(180deg, rgba(255,255,255,.03), rgba(0,0,0,.12));
      color: var(--text);
      border:1px solid var(--border);
      border-radius:14px;
      padding:10px 12px;
      outline:none;
      font-family: inherit;
    }

    textarea{
      min-height:180px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    button{
      cursor:pointer;
      border:1px solid var(--border);
      background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(0,0,0,.18));
      color: var(--text);
      padding:12px;
      border-radius:14px;
      font-weight:900;
      box-shadow:none; /* no glow */
    }
    button:hover{ border-color: var(--border2); }
    button:disabled{ opacity:.55; cursor:not-allowed; }

    .primary{
      background: linear-gradient(180deg, var(--y1), var(--y2));
      border-color: rgba(0,0,0,.35);
      color:#1a1a00;
      box-shadow:none; /* no glow */
    }

    .ghost{
      background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(0,0,0,.22));
    }

    .danger{
      background: linear-gradient(180deg, #2a313d, #1a212b);
    }

    .muted{ color:var(--muted); font-size:12px; }

    .resultBox{
      margin-top:10px;
      padding:14px;
      border-radius:14px;
      background: linear-gradient(180deg, rgba(255,255,255,.04), rgba(0,0,0,.22));
      border:1px dashed rgba(255,255,255,.14);
      white-space:pre-wrap;
      font-weight:900;
      line-height:1.25;
    }

    .list{
      margin-top:10px;
      border-radius:14px;
      border:1px solid var(--border);
      overflow:auto;
      background: rgba(0,0,0,.18);
    }

    table{ width:100%; border-collapse:collapse; }
    th, td{
      padding:10px;
      border-bottom:1px solid rgba(255,255,255,.06);
      font-size:13px;
      vertical-align:top;
    }
    th{
      position:sticky;
      top:0;
      background:#0c1016;
      border-bottom:1px solid rgba(255,255,255,.08);
      font-size:12px;
    }

    .tiers{ display:flex; gap:6px; flex-wrap:wrap; }
    .tierBtn{
      padding:6px 10px;
      border-radius:999px;
      border:1px solid var(--border);
      background: rgba(255,255,255,.04);
      cursor:pointer;
      font-weight:900;
      user-select:none;
      color: var(--text);
    }
    .tierBtn.active{
      background: linear-gradient(180deg, var(--y1), var(--y2));
      color:#1a1a00;
      border-color: rgba(0,0,0,.35);
    }

    details summary{ cursor:pointer; font-weight:900; }

    @media (max-width:980px){
      .grid{ grid-template-columns:1fr; }
    }
  </style>
</head>

<body>
  <div class="topbar">
    <div class="wrap">
      <h1>Perk Roller</h1>
    </div>
  </div>

  <div class="wrap">
    <div class="grid">

      <!-- LEFT -->
      <div class="card">
        <div class="row">
          <button class="primary" id="roll1">Roll 1</button>
          <button class="primary" id="roll2">Roll 2</button>
          <button class="primary" id="roll3">Roll 3</button>
          <button class="primary" id="roll4">Roll 4</button>
        </div>


        <div class="resultBox" id="resultBox">Click Roll 1 / Roll 2 / Roll 3</div>
        <div class="muted" style="margin-top:8px;" id="statsBox">Perks: —</div>

        <div class="row" style="margin-top:12px;">
          <input id="search" placeholder="Search perks..." />
          <button class="ghost" id="applyBtn" style="flex:0 0 170px;">Apply Perk List</button>
        </div>

        <div class="row" style="margin-top:10px;">
          <button class="danger" id="resetTiersBtn">Reset tiers</button>
          <button class="danger" id="clearLogBtn">Clear log</button>
        </div>

        <div class="list" style="max-height:420px;">
          <table>
            <thead>
              <tr>
                <th>Perk</th>
                <th style="width:80px;">Max</th>
                <th style="width:260px;">Tier</th>
              </tr>
            </thead>
            <tbody id="perkBody"></tbody>
          </table>
        </div>
      </div>

      <!-- RIGHT -->
      <div class="card">
        <div class="row">
          <b>Log</b>
          <div class="muted" style="text-align:right;" id="logCount">0 entries</div>
        </div>

        <div class="list" style="max-height:260px;">
          <table>
            <thead>
              <tr>
                <th style="width:160px;">Time</th>
                <th>Perk</th>
                <th style="width:90px;">Tier</th>
              </tr>
            </thead>
            <tbody id="logBody"></tbody>
          </table>
        </div>

        <details style="margin-top:14px;">
          <summary>Advanced (edit perk list)</summary>
          <div class="muted" style="margin-top:10px;">
            Format: <code>Perk Name | MaxTier | Weight</code> (MaxTier/Weight optional)
          </div>
          <textarea id="perkInput" spellcheck="false" style="margin-top:10px;"></textarea>
          <div class="row" style="margin-top:10px;">
            <button class="ghost" id="loadSampleBtn">Load sample</button>
            <button class="danger" id="wipeAllBtn">Wipe everything</button>
          </div>
        </details>
      </div>

    </div>
  </div>

<script>
  const LS_PERKS = "perkroller_perks_v6";
  const LS_TIERS = "perkroller_tiers_v6";
  const LS_LOG   = "perkroller_log_v6";

  const el = (id) => document.getElementById(id);
  const nowString = () => new Date().toLocaleString();

  function parsePerks(text){
    const lines = text.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
    const perks = [];
    for (const line of lines){
      const parts = line.split("|").map(p => p.trim());
      const name = parts[0];
      if (!name) continue;
      const maxTier = parts[1] ? Number(parts[1]) : 1;
      const weight  = parts[2] ? Number(parts[2]) : 1;
      perks.push({
        name,
        maxTier: Number.isFinite(maxTier) && maxTier > 0 ? Math.floor(maxTier) : 1,
        weight:  Number.isFinite(weight)  && weight  > 0 ? weight : 1
      });
    }
    return perks;
  }

  function weightedPick(items){
    const total = items.reduce((s,it)=>s+it.weight,0);
    let r = Math.random() * total;
    for (const it of items){
      r -= it.weight;
      if (r <= 0) return it;
    }
    return items[items.length - 1];
  }

  function loadJson(key, fallback){
    try{
      const raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : fallback;
    }catch{
      return fallback;
    }
  }
  function saveJson(key, value){
    localStorage.setItem(key, JSON.stringify(value));
  }

  function normalizeTiers(perks){
    const tiers = loadJson(LS_TIERS, {});
    const names = new Set(perks.map(p => p.name));

    for (const p of perks){
      if (!(p.name in tiers)) tiers[p.name] = null;
      const v = tiers[p.name];
      if (typeof v === "number"){
        if (v < 1) tiers[p.name] = null;
        if (v > p.maxTier) tiers[p.name] = p.maxTier;
      }
    }
    for (const k of Object.keys(tiers)){
      if (!names.has(k)) delete tiers[k];
    }
    saveJson(LS_TIERS, tiers);
    return tiers;
  }

  function renderStats(){
    const perks = parsePerks(el("perkInput").value);
    el("statsBox").textContent = `Perks: ${perks.length}`;
  }

  function renderPerks(){
    const perks = parsePerks(el("perkInput").value);
    const tiers = normalizeTiers(perks);
    const q = el("search").value.trim().toLowerCase();

    const body = el("perkBody");
    body.innerHTML = "";

    for (const p of perks){
      if (q && !p.name.toLowerCase().includes(q)) continue;

      const cur = tiers[p.name]; // null or number
      const tr = document.createElement("tr");

      const btns = [];
      btns.push(`<span class="tierBtn ${cur===null ? "active" : ""}" data-perk="${encodeURIComponent(p.name)}" data-tier="">None</span>`);
      for (let t=1; t<=p.maxTier; t++){
        btns.push(`<span class="tierBtn ${cur===t ? "active" : ""}" data-perk="${encodeURIComponent(p.name)}" data-tier="${t}">${t}</span>`);
      }

      tr.innerHTML = `
        <td><b>${escapeHtml(p.name)}</b><div class="muted" style="font-size:11px;">w=${p.weight}</div></td>
        <td>${p.maxTier}</td>
        <td><div class="tiers">${btns.join("")}</div></td>
      `;
      body.appendChild(tr);
    }

    renderStats();
  }

  // Event delegation: one click handler for all tier buttons (works with any perk name)
  el("perkBody").addEventListener("click", (e) => {
    const btn = e.target.closest(".tierBtn");
    if (!btn) return;

    const perkName = decodeURIComponent(btn.getAttribute("data-perk") || "");
    const tierStr = btn.getAttribute("data-tier"); // "" => None

    const perks = parsePerks(el("perkInput").value);
    const tiers = normalizeTiers(perks);

    tiers[perkName] = (tierStr === "" ? null : Number(tierStr));
    saveJson(LS_TIERS, tiers);

    renderPerks();
  });

  function renderLog(){
    const log = loadJson(LS_LOG, []);
    el("logCount").textContent = `${log.length} entr${log.length===1?"y":"ies"}`;

    el("logBody").innerHTML = log.slice().reverse().map(e => `
      <tr>
        <td>${escapeHtml(e.time)}</td>
        <td><b>${escapeHtml(e.perk)}</b></td>
        <td>${escapeHtml(e.tierAtRoll)}</td>
      </tr>
    `).join("");
  }

  function tierDisplay(cur, maxTier){
    return (cur === null) ? `None/${maxTier}` : `${cur}/${maxTier}`;
  }

  // No duplicates within a single click
  function rollN(nWanted){
    const perks = parsePerks(el("perkInput").value);
    if (!perks.length){
      el("resultBox").textContent = "Add perks in Advanced, then click Apply Perk List.";
      return;
    }

    const tiers = normalizeTiers(perks);

    let tempPool = perks.slice();
    const n = Math.min(nWanted, tempPool.length);

    const results = [];
    const log = loadJson(LS_LOG, []);

    for (let i=0; i<n; i++){
      const picked = weightedPick(tempPool);
      tempPool = tempPool.filter(p => p !== picked);

      const cur = tiers[picked.name] ?? null;
      const tdisp = tierDisplay(cur, picked.maxTier);

      results.push(`${i+1}) ${picked.name} — Tier ${tdisp}`);
      log.push({ time: nowString(), perk: picked.name, tierAtRoll: tdisp });
    }

    saveJson(LS_LOG, log);
    el("resultBox").textContent = results.join("\n");
    renderLog();
  }

  function applyPerkList(){
    localStorage.setItem(LS_PERKS, el("perkInput").value);
    const perks = parsePerks(el("perkInput").value);
    normalizeTiers(perks);
    el("resultBox").textContent = "Applied perk list.";
    renderPerks();
  }

  function resetTiers(){
    saveJson(LS_TIERS, {});
    renderPerks();
    el("resultBox").textContent = "Tiers reset.";
  }

  function clearLog(){
    saveJson(LS_LOG, []);
    renderLog();
    el("resultBox").textContent = "Log cleared.";
  }

  function wipeAll(){
    localStorage.removeItem(LS_PERKS);
    localStorage.removeItem(LS_TIERS);
    localStorage.removeItem(LS_LOG);

    el("perkInput").value = "";
    el("search").value = "";
    el("resultBox").textContent = "Wiped everything.";
    renderPerks();
    renderLog();
  }

  function escapeHtml(s){
    return String(s)
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;")
      .replaceAll('"',"&quot;")
      .replaceAll("'","&#039;");
  }

  // UI wiring
  el("roll1").addEventListener("click", () => rollN(1));
  el("roll2").addEventListener("click", () => rollN(2));
  el("roll3").addEventListener("click", () => rollN(3));
  el("roll4").addEventListener("click", () => rollN(4));

  el("applyBtn").addEventListener("click", applyPerkList);
  el("search").addEventListener("input", renderPerks);

  el("resetTiersBtn").addEventListener("click", resetTiers);
  el("clearLogBtn").addEventListener("click", clearLog);

  el("wipeAllBtn").addEventListener("click", wipeAll);

  el("loadSampleBtn").addEventListener("click", () => {
    el("perkInput").value =
`Gambler's Fallacy | 3 | 3
Fuck Off | 2 | 2
Noob Tube | 1 | 1
Perk Purge | 1 | 1
Blue Shell | 1 | 1
Thickfreakness | 3 | 2
Momentum Multiplier | 3 | 4`;
    el("resultBox").textContent = "Sample loaded. Click Apply Perk List.";
  });

  // Init
  const saved = localStorage.getItem(LS_PERKS);
  if (saved && saved.trim()){
    el("perkInput").value = saved;
  }else{
    el("perkInput").value = "Blue Shell | 1 | 1\nGambler's Fallacy | 3 | 3";
  }
  applyPerkList();
  renderLog();
</script>
</body>
</html>
