<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Perk Roller</title>

  <!-- Favicon (put favicon.png next to index.html) -->
  <link rel="icon" type="image/png" href="favicon.png?v=2">

  <style>
    :root{
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial;

      --bg0:#07090c;
      --bg1:#0b0f14;

      --panel: rgba(255,255,255,.045);
      --panel2: rgba(255,255,255,.03);

      --border: rgba(255,255,255,.08);
      --border2: rgba(255,255,255,.14);

      --text:#e8eef7;
      --muted: rgba(232,238,247,.72);

      --y1:#ffff00;
      --y2:#e6e600;

      --r:16px;
    }

    body{
      margin:0;
      color:var(--text);
      background:
        radial-gradient(1000px 600px at 50% 10%, rgba(255,255,255,.06), transparent 60%),
        radial-gradient(900px 600px at 50% 100%, rgba(0,0,0,.55), transparent 60%),
        linear-gradient(180deg, var(--bg0), var(--bg1));
    }

    .topbar{
      padding:14px 18px;
      border-bottom:1px solid rgba(255,255,255,.06);
      background: rgba(0,0,0,.18);
    }

    .wrap{ max-width:1200px; margin:0 auto; padding:18px; }

    h1{ margin:0; font-size:20px; }

    .grid{
      display:grid;
      grid-template-columns: 2fr 1fr;
      gap:14px;
      margin-top:14px;
      align-items:start;
    }

    .card{
      background: linear-gradient(180deg, var(--panel), var(--panel2));
      border:1px solid var(--border);
      border-radius: var(--r);
      padding:14px;
    }

    .row{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
    .row > * { flex:1; }

    input{
      width:100%;
      box-sizing:border-box;
      background: linear-gradient(180deg, rgba(255,255,255,.03), rgba(0,0,0,.12));
      color: var(--text);
      border:1px solid var(--border);
      border-radius:14px;
      padding:10px 12px;
      outline:none;
      font-family: inherit;
    }

    button{
      cursor:pointer;
      border:1px solid var(--border);
      background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(0,0,0,.18));
      color: var(--text);
      padding:12px;
      border-radius:14px;
      font-weight:900;
      box-shadow:none; /* no glow */
    }
    button:hover{ border-color: var(--border2); }
    button:disabled{ opacity:.55; cursor:not-allowed; }

    .primary{
      background: linear-gradient(180deg, var(--y1), var(--y2));
      border-color: rgba(0,0,0,.35);
      color:#1a1a00;
      box-shadow:none; /* no glow */
    }

    .danger{
      background: linear-gradient(180deg, #2a313d, #1a212b);
    }

    .muted{ color:var(--muted); font-size:12px; }

    .resultBox{
      margin-top:10px;
      padding:14px;
      border-radius:14px;
      background: linear-gradient(180deg, rgba(255,255,255,.04), rgba(0,0,0,.22));
      border:1px dashed rgba(255,255,255,.14);
      white-space:pre-wrap;
      font-weight:900;
      line-height:1.25;
    }

    .list{
      margin-top:10px;
      border-radius:14px;
      border:1px solid var(--border);
      overflow:auto;
      background: rgba(0,0,0,.18);
    }

    table{ width:100%; border-collapse:collapse; }
    th, td{
      padding:10px;
      border-bottom:1px solid rgba(255,255,255,.06);
      font-size:13px;
      vertical-align:top;
    }
    th{
      position:sticky;
      top:0;
      background:#0c1016;
      border-bottom:1px solid rgba(255,255,255,.08);
      font-size:12px;
    }

    .tiers{ display:flex; gap:6px; flex-wrap:wrap; }
    .tierBtn{
      padding:6px 10px;
      border-radius:999px;
      border:1px solid var(--border);
      background: rgba(255,255,255,.04);
      cursor:pointer;
      font-weight:900;
      user-select:none;
      color: var(--text);
    }
    .tierBtn.active{
      background: linear-gradient(180deg, var(--y1), var(--y2));
      color:#1a1a00;
      border-color: rgba(0,0,0,.35);
    }

    .pill{
      display:inline-block;
      padding:2px 8px;
      border-radius:999px;
      border:1px solid var(--border);
      background: rgba(255,255,255,.04);
      font-size:12px;
      color: var(--text);
    }

    @media (max-width:980px){
      .grid{ grid-template-columns:1fr; }
    }
  </style>
</head>

<body>
  <div class="topbar">
    <div class="wrap">
      <h1>Perk Roller</h1>
    </div>
  </div>

  <div class="wrap">
    <div class="grid">

      <!-- LEFT -->
      <div class="card">
        <div class="row">
          <button class="primary" id="roll1">Roll 1</button>
          <button class="primary" id="roll2">Roll 2</button>
          <button class="primary" id="roll3">Roll 3</button>
          <button class="primary" id="roll4">Roll 4</button>
        </div>

        <div class="resultBox" id="resultBox">Click Roll 1 / 2 / 3 / 4</div>

        <div class="muted" style="margin-top:8px;" id="statsBox">Perks: —</div>

        <div class="row" style="margin-top:12px;">
          <input id="search" placeholder="Search perks..." />
        </div>

        <div class="row" style="margin-top:10px;">
          <button class="danger" id="resetTiersBtn">Reset tiers</button>
          <button class="danger" id="clearLogBtn">Clear log</button>
        </div>

        <div class="list" style="max-height:520px;">
          <table>
            <thead>
              <tr>
                <th>Perk</th>
                <th style="width:70px;">Max</th>
                <th style="width:80px;">Weight</th>
                <th style="width:320px;">Tier</th>
              </tr>
            </thead>
            <tbody id="perkBody"></tbody>
          </table>
        </div>
      </div>

      <!-- RIGHT -->
      <div class="card">
        <div class="row">
          <b>Log</b>
          <div class="muted" style="text-align:right;" id="logCount">0 entries</div>
        </div>

        <div class="muted" style="margin-top:6px;">
          Tip: tiers are manual. Rolling does not change tiers.
        </div>

        <div class="list" style="max-height:620px;">
          <table>
            <thead>
              <tr>
                <th style="width:160px;">Time</th>
                <th>Perk</th>
                <th style="width:120px;">Tier</th>
              </tr>
            </thead>
            <tbody id="logBody"></tbody>
          </table>
        </div>
      </div>

    </div>
  </div>

<script>
  // =========================
  // LOCKED PERK LIST (FINAL)
  // =========================
  const PERKS = [
    { name: "Blackbird", maxTier: 0, weight: 1 },
    { name: "Blueshell", maxTier: 0, weight: 1 },
    { name: "Charred Dice", maxTier: 0, weight: 1 },
    { name: "Clairvoyant", maxTier: 0, weight: 1 },
    { name: "Clean Slate", maxTier: 0, weight: 1 },
    { name: "Compound Interest", maxTier: 0, weight: 1 },
    { name: "Deadlineduel", maxTier: 0, weight: 1 },
    { name: "Devil Deal", maxTier: 0, weight: 3 },

    { name: "Dicey Fortune", maxTier: 2, weight: 1 },
    { name: "Fuck Off", maxTier: 1, weight: 1 },

    { name: "ICBA", maxTier: 2, weight: 1 },

    { name: "Master of Fate", maxTier: 1, weight: 1 },

    { name: "Momentum Multiplier", maxTier: 2, weight: 1 },

    { name: "Noob Tube", maxTier: 0, weight: 1 },

    { name: "Perkaholic", maxTier: 2, weight: 1 },

    { name: "Perk Purge", maxTier: 0, weight: 1 },
    { name: "Perk Purification", maxTier: 0, weight: 1 },

    { name: "Phantom Roll", maxTier: 0, weight: 1 },
    { name: "Relic of the Past", maxTier: 0, weight: 1 },

    { name: "Reset Rhythm", maxTier: 2, weight: 1 },

    { name: "Saboteur’s Gambit", maxTier: 0, weight: 1 },
    { name: "Scorched Earth", maxTier: 0, weight: 1 },
    { name: "Score Spike", maxTier: 0, weight: 1 },
    { name: "Streaking", maxTier: 2, weight: 1 },
    { name: "Task Overflow", maxTier: 0, weight: 2 },

    { name: "Token of Immunity", maxTier: 0, weight: 1 },
    { name: "Token Taker", maxTier: 0, weight: 1 },
    { name: "Unlucky Charm", maxTier: 0, weight: 1 },
  ];

  // =========================
  // STORAGE
  // =========================
  const LS_TIERS = "perkroller_locked_tiers_v1"; // { [name]: null|number } (only for maxTier>0)
  const LS_LOG   = "perkroller_locked_log_v1";

  const el = (id) => document.getElementById(id);
  const nowString = () => new Date().toLocaleString();

  function escapeHtml(s){
    return String(s)
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;")
      .replaceAll('"',"&quot;")
      .replaceAll("'","&#039;");
  }

  function loadJson(key, fallback){
    try{
      const raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : fallback;
    }catch{
      return fallback;
    }
  }
  function saveJson(key, value){
    localStorage.setItem(key, JSON.stringify(value));
  }

  function normalizeTiers(){
    const tiers = loadJson(LS_TIERS, {});
    const names = new Set(PERKS.map(p => p.name));

    for (const p of PERKS){
      // only store tiers for perks that actually have tiers
      if (p.maxTier > 0){
        if (!(p.name in tiers)) tiers[p.name] = null;
        const v = tiers[p.name];
        if (typeof v === "number"){
          if (v < 1) tiers[p.name] = null;
          if (v > p.maxTier) tiers[p.name] = p.maxTier;
        }
      } else {
        // ensure no stray tier value lingers for maxTier=0 perks
        if (p.name in tiers) delete tiers[p.name];
      }
    }

    // remove tiers for perks not in list
    for (const k of Object.keys(tiers)){
      if (!names.has(k)) delete tiers[k];
    }

    saveJson(LS_TIERS, tiers);
    return tiers;
  }

  function tierDisplayForRoll(perk, tiers){
    if (perk.maxTier <= 0) return "N/A";
    const cur = (tiers[perk.name] ?? null);
    return (cur === null) ? `None/${perk.maxTier}` : `${cur}/${perk.maxTier}`;
  }

  function weightedPick(items){
    const total = items.reduce((s,it)=>s+it.weight,0);
    let r = Math.random() * total;
    for (const it of items){
      r -= it.weight;
      if (r <= 0) return it;
    }
    return items[items.length - 1];
  }

  function renderStats(){
    el("statsBox").innerHTML =
      `Perks: ${PERKS.length} &nbsp; <span class="pill">Devil Deal w=3</span> <span class="pill">Task Overflow w=2</span>`;
  }

  function renderPerks(){
    const tiers = normalizeTiers();
    const q = el("search").value.trim().toLowerCase();

    const body = el("perkBody");
    body.innerHTML = "";

    for (const p of PERKS){
      if (q && !p.name.toLowerCase().includes(q)) continue;

      let tierCell = "";
      if (p.maxTier <= 0){
        tierCell = `<span class="muted">N/A</span>`;
      } else {
        const cur = tiers[p.name]; // null or number
        const btns = [];
        btns.push(`<span class="tierBtn ${cur===null ? "active" : ""}" data-perk="${encodeURIComponent(p.name)}" data-tier="">None</span>`);
        for (let t=1; t<=p.maxTier; t++){
          btns.push(`<span class="tierBtn ${cur===t ? "active" : ""}" data-perk="${encodeURIComponent(p.name)}" data-tier="${t}">${t}</span>`);
        }
        tierCell = `<div class="tiers">${btns.join("")}</div>`;
      }

      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td><b>${escapeHtml(p.name)}</b></td>
        <td>${p.maxTier}</td>
        <td>${p.weight}</td>
        <td>${tierCell}</td>
      `;
      body.appendChild(tr);
    }
  }

  // Tier clicks (only works for perks with maxTier > 0; those buttons are the only ones rendered)
  el("perkBody").addEventListener("click", (e) => {
    const btn = e.target.closest(".tierBtn");
    if (!btn) return;

    const perkName = decodeURIComponent(btn.getAttribute("data-perk") || "");
    const tierStr = btn.getAttribute("data-tier"); // "" => None

    const perk = PERKS.find(p => p.name === perkName);
    if (!perk || perk.maxTier <= 0) return;

    const tiers = normalizeTiers();
    tiers[perkName] = (tierStr === "" ? null : Number(tierStr));
    saveJson(LS_TIERS, tiers);

    renderPerks();
  });

  function renderLog(){
    const log = loadJson(LS_LOG, []);
    el("logCount").textContent = `${log.length} entr${log.length===1?"y":"ies"}`;
    el("logBody").innerHTML = log.slice().reverse().map(e => `
      <tr>
        <td>${escapeHtml(e.time)}</td>
        <td><b>${escapeHtml(e.perk)}</b></td>
        <td>${escapeHtml(e.tierAtRoll)}</td>
      </tr>
    `).join("");
  }

  function rollN(nWanted){
    const tiers = normalizeTiers();

    // No duplicates within the same click
    let tempPool = PERKS.slice();
    const n = Math.min(nWanted, tempPool.length);

    const results = [];
    const log = loadJson(LS_LOG, []);

    for (let i=0; i<n; i++){
      const picked = weightedPick(tempPool);
      tempPool = tempPool.filter(p => p !== picked);

      const tdisp = tierDisplayForRoll(picked, tiers);
      results.push(`${i+1}) ${picked.name} — Tier ${tdisp}`);

      log.push({ time: nowString(), perk: picked.name, tierAtRoll: tdisp });
    }

    saveJson(LS_LOG, log);
    el("resultBox").textContent = results.join("\n");
    renderLog();
  }

  function resetTiers(){
    saveJson(LS_TIERS, {});
    el("resultBox").textContent = "Tiers reset.";
    renderPerks();
  }

  function clearLog(){
    saveJson(LS_LOG, []);
    el("resultBox").textContent = "Log cleared.";
    renderLog();
  }

  // Wire up UI
  el("roll1").addEventListener("click", () => rollN(1));
  el("roll2").addEventListener("click", () => rollN(2));
  el("roll3").addEventListener("click", () => rollN(3));
  el("roll4").addEventListener("click", () => rollN(4));

  el("resetTiersBtn").addEventListener("click", resetTiers);
  el("clearLogBtn").addEventListener("click", clearLog);
  el("search").addEventListener("input", renderPerks);

  // Init
  renderStats();
  renderPerks();
  renderLog();
</script>
</body>
</html>
