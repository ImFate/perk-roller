<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Inferno Perk Roller</title>

  <style>
    :root{
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial;

      --bg0:#07090c;
      --bg1:#0b0f14;

      --panel: rgba(255,255,255,.045);
      --panel2: rgba(255,255,255,.03);

      --border: rgba(255,255,255,.08);
      --border2: rgba(255,255,255,.14);

      --text:#e8eef7;
      --muted: rgba(232,238,247,.72);

      /* YELLOW BUTTONS */
      --orange:#ffff00;
      --orange2:#e6e600;

      --shadow: 0 18px 60px rgba(0,0,0,.55);
      --shadow2: 0 10px 28px rgba(0,0,0,.45);

      --r:16px;
    }

    body{
      margin:0;
      color:var(--text);
      background:
        radial-gradient(1000px 600px at 50% 10%, rgba(255,255,255,.06), transparent 60%),
        radial-gradient(900px 600px at 50% 100%, rgba(0,0,0,.55), transparent 60%),
        linear-gradient(180deg, var(--bg0), var(--bg1));
    }

    .topbar{
      padding:14px 18px;
      border-bottom:1px solid rgba(255,255,255,.06);
      background: rgba(0,0,0,.18);
      backdrop-filter: blur(6px);
    }

    .wrap{ max-width:1200px; margin:0 auto; padding:18px; }

    h1{ margin:0; font-size:20px; }

    .grid{
      display:grid;
      grid-template-columns: 2fr 1fr;
      gap:14px;
      margin-top:14px;
    }

    .card{
      background: linear-gradient(180deg, var(--panel), var(--panel2));
      border:1px solid var(--border);
      border-radius: var(--r);
      padding:14px;
      box-shadow: var(--shadow2);
      backdrop-filter: blur(6px);
    }

    .row{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
    .row > * { flex:1; }

    input, textarea{
      width:100%;
      background: linear-gradient(180deg, rgba(255,255,255,.03), rgba(0,0,0,.12));
      color: var(--text);
      border:1px solid var(--border);
      border-radius:14px;
      padding:10px 12px;
      outline:none;
    }

    textarea{
      min-height:160px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    button{
      cursor:pointer;
      border:1px solid var(--border);
      background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(0,0,0,.18));
      color: var(--text);
      padding:12px;
      border-radius:14px;
      font-weight:900;
      box-shadow: 0 8px 18px rgba(0,0,0,.35);
    }

    .primary{
      background: linear-gradient(180deg, var(--orange), var(--orange2));
      border-color: rgba(0,0,0,.35);
      color:#1a1a00;
      box-shadow: 0 10px 22px rgba(255,255,0,.25);
    }

    .ghost{
      background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(0,0,0,.22));
    }

    .danger{
      background: linear-gradient(180deg, #2a313d, #1a212b);
    }

    .muted{ color:var(--muted); font-size:12px; }

    .resultBox{
      margin-top:10px;
      padding:14px;
      border-radius:14px;
      background: linear-gradient(180deg, rgba(255,255,255,.04), rgba(0,0,0,.22));
      border:1px dashed rgba(255,255,255,.14);
      white-space:pre-wrap;
      font-weight:900;
    }

    .list{
      margin-top:10px;
      border-radius:14px;
      border:1px solid var(--border);
      overflow:auto;
    }

    table{ width:100%; border-collapse:collapse; }
    th, td{
      padding:10px;
      border-bottom:1px solid rgba(255,255,255,.06);
      font-size:13px;
    }

    th{
      position:sticky;
      top:0;
      background:#0c1016;
    }

    .tiers{ display:flex; gap:6px; }
    .tierBtn{
      padding:6px 10px;
      border-radius:999px;
      border:1px solid var(--border);
      background: rgba(255,255,255,.04);
      cursor:pointer;
      font-weight:900;
    }

    .tierBtn.active{
      background: linear-gradient(180deg, var(--orange), var(--orange2));
      color:#1a1a00;
    }

    @media (max-width:980px){
      .grid{ grid-template-columns:1fr; }
    }
  </style>
</head>

<body>
  <div class="topbar">
    <div class="wrap">
      <h1>Task Roller</h1>
    </div>
  </div>

  <div class="wrap">
    <div class="grid">

      <div class="card">
        <div class="row">
          <button class="primary" id="roll1">Roll 1</button>
          <button class="primary" id="roll2">Roll 2</button>
          <button class="primary" id="roll3">Roll 3</button>
        </div>

        <div class="resultBox" id="resultBox">Click Roll 1 / 2 / 3</div>

        <div class="row" style="margin-top:10px;">
          <input id="search" placeholder="Search perks..." />
          <button class="ghost" id="saveBtn">Save</button>
        </div>

        <div class="list" style="max-height:360px;">
          <table>
            <thead>
              <tr>
                <th>Perk</th>
                <th>Max</th>
                <th>Tier</th>
              </tr>
            </thead>
            <tbody id="perkBody"></tbody>
          </table>
        </div>
      </div>

      <div class="card">
        <b>Log</b>
        <div class="list" style="max-height:420px;">
          <table>
            <thead>
              <tr>
                <th>Time</th>
                <th>Perk</th>
                <th>Tier</th>
              </tr>
            </thead>
            <tbody id="logBody"></tbody>
          </table>
        </div>
      </div>

      <div class="card" style="grid-column:1/-1;">
        <details>
          <summary>Advanced</summary>
          <textarea id="perkInput"></textarea>
        </details>
      </div>

    </div>
  </div>

<script>
  const el = id => document.getElementById(id);

  function parsePerks(t){
    return t.split(/\n/).map(l=>{
      const [n,m=1,w=1]=l.split("|").map(s=>s.trim());
      return n?{name:n,max:+m||1,weight:+w||1}:null;
    }).filter(Boolean);
  }

  function weightedPick(arr){
    let t=arr.reduce((s,p)=>s+p.weight,0),r=Math.random()*t;
    for(const p of arr){ if((r-=p.weight)<=0) return p; }
    return arr[arr.length-1];
  }

  function render(){
    const perks=parsePerks(el("perkInput").value);
    el("perkBody").innerHTML=perks.map(p=>`
      <tr>
        <td>${p.name}</td>
        <td>${p.max}</td>
        <td>
          <div class="tiers">
            ${["None",...Array.from({length:p.max},(_,i)=>i+1)].map(v=>`
              <span class="tierBtn">${v}</span>`).join("")}
          </div>
        </td>
      </tr>`).join("");
  }

  function roll(n){
    const perks=parsePerks(el("perkInput").value);
    const pool=[...perks];
    const out=[];
    for(let i=0;i<n && pool.length;i++){
      const p=weightedPick(pool);
      pool.splice(pool.indexOf(p),1);
      out.push(`${i+1}) ${p.name}`);
    }
    el("resultBox").textContent=out.join("\n");
  }

  el("roll1").onclick=()=>roll(1);
  el("roll2").onclick=()=>roll(2);
  el("roll3").onclick=()=>roll(3);
  el("saveBtn").onclick=render;

  render();
</script>
</body>
</html>
