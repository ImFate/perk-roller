<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Perk Roller</title>
  <link rel="icon" type="image/png" href="favicon.png?v=999">

  <style>
    :root{
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial;
      --bg0:#07090c; --bg1:#0b0f14;
      --panel: rgba(255,255,255,.045);
      --panel2: rgba(255,255,255,.03);
      --border: rgba(255,255,255,.08);
      --border2: rgba(255,255,255,.14);
      --text:#e8eef7;
      --muted: rgba(232,238,247,.72);
      --y1:#ffff00; --y2:#e6e600;
      --r:16px;
    }

    body{
      margin:0; color:var(--text);
      background:
        radial-gradient(1000px 600px at 50% 10%, rgba(255,255,255,.06), transparent 60%),
        radial-gradient(900px 600px at 50% 100%, rgba(0,0,0,.55), transparent 60%),
        linear-gradient(180deg, var(--bg0), var(--bg1));
    }

    .topbar{
      padding:14px 18px;
      border-bottom:1px solid rgba(255,255,255,.06);
      background: rgba(0,0,0,.18);
    }

    .wrap{ max-width:1200px; margin:0 auto; padding:18px; }
    h1{ margin:0; font-size:20px; }

    .grid{
      display:grid;
      grid-template-columns: 2fr 1fr;
      gap:14px;
      margin-top:14px;
      align-items:start;
    }

    .card{
      background: linear-gradient(180deg, var(--panel), var(--panel2));
      border:1px solid var(--border);
      border-radius: var(--r);
      padding:14px;
    }

    .row{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
    .row > * { flex:1; }

    button{
      cursor:pointer;
      border:1px solid var(--border);
      background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(0,0,0,.18));
      color: var(--text);
      padding:12px;
      border-radius:14px;
      font-weight:900;
    }

    .primary{
      background: linear-gradient(180deg, var(--y1), var(--y2));
      color:#1a1a00;
      border-color: rgba(0,0,0,.35);
    }

    .danger{
      background: linear-gradient(180deg, #2a313d, #1a212b);
    }

    .muted{ color:var(--muted); font-size:12px; }

    /* 🔽 TABLE / LIST */
    .list{
      margin-top:10px;
      border-radius:14px;
      border:1px solid var(--border);
      background: rgba(0,0,0,.18);
      /* NO max-height, NO overflow */
    }

    table{ width:100%; border-collapse:collapse; }

    th, td{
      padding:10px;
      border-bottom:1px solid rgba(255,255,255,.06);
      font-size:13px;
      vertical-align:top;
    }

    th{
      background:#0c1016;
      font-size:12px;
    }

    .tiers{ display:flex; gap:6px; flex-wrap:wrap; }

    .tierBtn{
      padding:6px 10px;
      border-radius:999px;
      border:1px solid var(--border);
      background: rgba(255,255,255,.04);
      cursor:pointer;
      font-weight:900;
    }

    .tierBtn.active{
      background: linear-gradient(180deg, var(--y1), var(--y2));
      color:#1a1a00;
      border-color: rgba(0,0,0,.35);
    }

    .tierBtn.max{
      border-style:dashed;
    }

    .perkInactive td{ opacity:.55; }

    .rollGrid{
      margin-top:10px;
      display:grid;
      grid-template-columns: repeat(4, minmax(0,1fr));
      gap:12px;
    }

    .rollCard{
      border:1px solid rgba(255,255,255,.10);
      border-radius:14px;
      overflow:hidden;
      background: linear-gradient(180deg, rgba(255,255,255,.04), rgba(0,0,0,.28));
    }

    .rollCard img{ width:100%; display:block; }

    .rollMeta{
      padding:10px;
      border-top:1px solid rgba(255,255,255,.06);
      font-size:12px;
    }

    .toast{
      position: fixed;
      left: 50%;
      bottom: 16px;
      transform: translateX(-50%);
      background: rgba(0,0,0,.75);
      border:1px solid rgba(255,255,255,.16);
      padding:10px 12px;
      border-radius:999px;
      font-weight:900;
      font-size:12px;
      display:none;
      z-index:9999;
    }

    @media (max-width:980px){
      .grid{ grid-template-columns:1fr; }
      .rollGrid{ grid-template-columns: repeat(2,1fr); }
    }
  </style>
</head>

<body>
  <div class="topbar">
    <div class="wrap"><h1>Perk Roller</h1></div>
  </div>

  <div class="wrap">
    <div class="grid">
      <div class="card">
        <div class="row">
          <button class="primary" id="roll1">Roll 1</button>
          <button class="primary" id="roll2">Roll 2</button>
          <button class="primary" id="roll3">Roll 3</button>
          <button class="primary" id="roll4">Roll 4</button>
        </div>

        <div id="rollOutput" class="rollGrid"></div>

        <div class="row" style="margin-top:12px;">
          <button class="danger" id="downloadRollBtn">Download roll (image)</button>
          <button class="danger" id="copyTextBtn">Copy roll (text)</button>
        </div>

        <div class="list">
          <table>
            <thead>
              <tr>
                <th>Perk</th>
                <th>Max</th>
                <th>Weight</th>
                <th>Tier / MAX</th>
              </tr>
            </thead>
            <tbody id="perkBody"></tbody>
          </table>
        </div>
      </div>

      <div class="card">
        <b>Log</b>
        <div class="list">
          <table>
            <thead>
              <tr>
                <th>Time</th>
                <th>Perk</th>
                <th>Tier</th>
              </tr>
            </thead>
            <tbody id="logBody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <!-- JS remains unchanged from your working MAX version -->
  <script src="script.js"></script>
</body>
</html>
