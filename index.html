<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Perk Roller</title>

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon.png">

  <style>
    :root{
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial;

      --bg0:#07090c;
      --bg1:#0b0f14;

      --panel: rgba(255,255,255,.045);
      --panel2: rgba(255,255,255,.03);

      --border: rgba(255,255,255,.08);
      --border2: rgba(255,255,255,.14);

      --text:#e8eef7;
      --muted: rgba(232,238,247,.72);

      /* Yellow buttons */
      --y1:#ffff00;
      --y2:#e6e600;

      --r:16px;
    }

    body{
      margin:0;
      color:var(--text);
      background:
        radial-gradient(1000px 600px at 50% 10%, rgba(255,255,255,.06), transparent 60%),
        radial-gradient(900px 600px at 50% 100%, rgba(0,0,0,.55), transparent 60%),
        linear-gradient(180deg, var(--bg0), var(--bg1));
    }

    .topbar{
      padding:14px 18px;
      border-bottom:1px solid rgba(255,255,255,.06);
      background: rgba(0,0,0,.18);
    }

    .wrap{ max-width:1200px; margin:0 auto; padding:18px; }

    h1{ margin:0; font-size:20px; }

    .grid{
      display:grid;
      grid-template-columns: 2fr 1fr;
      gap:14px;
      margin-top:14px;
      align-items:start;
    }

    .card{
      background: linear-gradient(180deg, var(--panel), var(--panel2));
      border:1px solid var(--border);
      border-radius: var(--r);
      padding:14px;
    }

    .row{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
    .row > * { flex:1; }

    input, textarea{
      width:100%;
      box-sizing:border-box;
      background: linear-gradient(180deg, rgba(255,255,255,.03), rgba(0,0,0,.12));
      color: var(--text);
      border:1px solid var(--border);
      border-radius:14px;
      padding:10px 12px;
      outline:none;
      font-family: inherit;
    }

    textarea{
      min-height:180px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    button{
      cursor:pointer;
      border:1px solid var(--border);
      background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(0,0,0,.18));
      color: var(--text);
      padding:12px;
      border-radius:14px;
      font-weight:900;
      box-shadow:none; /* NO GLOW */
    }

    button:hover{ border-color: var(--border2); }
    button:disabled{ opacity:.55; cursor:not-allowed; }

    .primary{
      background: linear-gradient(180deg, var(--y1), var(--y2));
      border-color: rgba(0,0,0,.35);
      color:#1a1a00;
      box-shadow:none; /* NO GLOW */
    }

    .ghost{
      background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(0,0,0,.22));
    }

    .danger{
      background: linear-gradient(180deg, #2a313d, #1a212b);
    }

    .muted{ color:var(--muted); font-size:12px; }

    .resultBox{
      margin-top:10px;
      padding:14px;
      border-radius:14px;
      background: linear-gradient(180deg, rgba(255,255,255,.04), rgba(0,0,0,.22));
      border:1px dashed rgba(255,255,255,.14);
      white-space:pre-wrap;
      font-weight:900;
      line-height:1.25;
    }

    .list{
      margin-top:10px;
      border-radius:14px;
      border:1px solid var(--border);
      overflow:auto;
      background: rgba(0,0,0,.18);
    }

    table{ width:100%; border-collapse:collapse; }
    th, td{
      padding:10px;
      border-bottom:1px solid rgba(255,255,255,.06);
      font-size:13px;
      vertical-align:top;
    }
    th{
      position:sticky;
      top:0;
      background:#0c1016;
      border-bottom:1px solid rgba(255,255,255,.08);
      font-size:12px;
    }

    .tiers{ display:flex; gap:6px; flex-wrap:wrap; }
    .tierBtn{
      padding:6px 10px;
      border-radius:999px;
      border:1px solid var(--border);
      background: rgba(255,255,255,.04);
      cursor:pointer;
      font-weight:900;
      user-select:none;
    }

    .tierBtn.active{
      background: linear-gradient(180deg, var(--y1), var(--y2));
      color:#1a1a00;
      border-color: rgba(0,0,0,.35);
    }

    details summary{
      cursor:pointer;
      font-weight:900;
    }

    @media (max-width:980px){
      .grid{ grid-template-columns:1fr; }
    }
  </style>
</head>

<body>
  <div class="topbar">
    <div class="wrap">
      <h1>Perk Roller</h1>
    </div>
  </div>

  <div class="wrap">
    <div class="grid">

      <!-- LEFT -->
      <div class="card">
        <div class="row">
          <button class="primary" id="roll1">Roll 1</button>
          <button class="primary" id="roll2">Roll 2</button>
          <button class="primary" id="roll3">Roll 3</button>
        </div>

        <div class="resultBox" id="resultBox">Click Roll 1 / Roll 2 / Roll 3</div>
        <div class="muted" style="margin-top:8px;" id="statsBox">Perks: —</div>

        <div class="row" style="margin-top:12px;">
          <input id="search" placeholder="Search perks..." />
          <button class="ghost" id="applyBtn" style="flex:0 0 170px;">Apply Perk List</button>
        </div>

        <div class="row" style="margin-top:10px;">
          <button class="danger" id="resetTiersBtn">Reset tiers</button>
          <button class="danger" id="clearLogBtn">Clear log</button>
        </div>

        <div class="list" style="max-height:420px;">
          <table>
            <thead>
              <tr>
                <th>Perk</th>
                <th style="width:80px;">Max</th>
                <th style="width:260px;">Tier</th>
              </tr>
            </thead>
            <tbody id="perkBody"></tbody>
          </table>
        </div>
      </div>

      <!-- RIGHT -->
      <div class="card">
        <div class="row">
          <b>Log</b>
          <div class="muted" style="text-align:right;" id="logCount">0 entries</div>
        </div>

        <div class="list" style="max-height:260px;">
          <table>
            <thead>
              <tr>
                <th style="width:160px;">Time</th>
                <th>Perk</th>
                <th style="width:90px;">Tier</th>
              </tr>
            </thead>
            <tbody id="logBody"></tbody>
          </table>
        </div>

        <details style="margin-top:14px;">
          <summary>Advanced (edit perk list)</summary>
          <div class="muted" style="margin-top:10px;">
            Format: <code>Perk Name | MaxTier | Weight</code>
          </div>
          <textarea id="perkInput" spellcheck="false" style="margin-top:10px;"></textarea>
          <div class="row" style="margin-top:10px;">
            <button class="ghost" id="loadSampleBtn">Load sample</button>
            <button class="danger" id="wipeAllBtn">Wipe everything</button>
          </div>
        </details>
      </div>

    </div>
  </div>

<script>
  const LS_PERKS="perkroller_perks_v5";
  const LS_TIERS="perkroller_tiers_v5";
  const LS_LOG="perkroller_log_v5";
  const el=id=>document.getElementById(id);
  const now=()=>new Date().toLocaleString();

  function parsePerks(t){
    return t.split(/\n/).map(l=>{
      const [n,m=1,w=1]=l.split("|").map(s=>s.trim());
      return n?{name:n,max:+m||1,weight:+w||1}:null;
    }).filter(Boolean);
  }

  function pick(arr){
    let t=arr.reduce((s,p)=>s+p.weight,0),r=Math.random()*t;
    for(const p of arr){ if((r-=p.weight)<=0) return p; }
    return arr[arr.length-1];
  }

  function load(k){return JSON.parse(localStorage.getItem(k)||"null")}
  function save(k,v){localStorage.setItem(k,JSON.stringify(v))}

  function init(){
    el("perkInput").value=localStorage.getItem(LS_PERKS)||"";
    if(!el("perkInput").value.trim())
      el("perkInput").value="Blue Shell | 1 | 1\nGambler's Fallacy | 3 | 3";
    apply();
    renderLog();
  }

  function apply(){
    localStorage.setItem(LS_PERKS,el("perkInput").value);
    const perks=parsePerks(el("perkInput").value);
    const tiers=load(LS_TIERS)||{};
    perks.forEach(p=>tiers[p.name]??=null);
    save(LS_TIERS,tiers);
    render();
  }

  function render(){
    const perks=parsePerks(el("perkInput").value);
    const tiers=load(LS_TIERS)||{};
    el("perkBody").innerHTML=perks.map(p=>{
      const cur=tiers[p.name];
      const btns=["None",...Array.from({length:p.max},(_,i)=>i+1)]
        .map(v=>`<span class="tierBtn ${cur===v||(!cur&&v==="None")?"active":""}"
          onclick="setTier('${p.name}',${v==="None"?"null":v})">${v}</span>`).join("");
      return `<tr><td>${p.name}</td><td>${p.max}</td><td><div class="tiers">${btns}</div></td></tr>`;
    }).join("");
    el("statsBox").textContent=`Perks: ${perks.length}`;
  }

  window.setTier=(n,v)=>{
    const t=load(LS_TIERS)||{};
    t[n]=v;
    save(LS_TIERS,t);
    render();
  };

  function roll(n){
    const perks=parsePerks(el("perkInput").value);
    let pool=[...perks],out=[],log=load(LS_LOG)||[];
    for(let i=0;i<n&&pool.length;i++){
      const p=pick(pool); pool=pool.filter(x=>x!==p);
      out.push(`${i+1}) ${p.name}`);
      log.push({time:now(),perk:p.name,tier:(load(LS_TIERS)||{})[p.name]});
    }
    save(LS_LOG,log);
    el("resultBox").textContent=out.join("\n");
    renderLog();
  }

  function renderLog(){
    const log=load(LS_LOG)||[];
    el("logCount").textContent=`${log.length} entries`;
    el("logBody").innerHTML=log.slice().reverse()
      .map(e=>`<tr><td>${e.time}</td><td>${e.perk}</td><td>${e.tier??"None"}</td></tr>`).join("");
  }

  function resetTiers(){save(LS_TIERS,{});apply()}
  function clearLog(){save(LS_LOG,[]);renderLog()}
  function wipeAll(){
    localStorage.clear();
    el("perkInput").value="";
    init();
  }

  el("roll1").onclick=()=>roll(1);
  el("roll2").onclick=()=>roll(2);
  el("roll3").onclick=()=>roll(3);
  el("applyBtn").onclick=apply;
  el("resetTiersBtn").onclick=resetTiers;
  el("clearLogBtn").onclick=clearLog;
  el("wipeAllBtn").onclick=wipeAll;
  el("loadSampleBtn").onclick=()=>{el("perkInput").value="Blue Shell | 1 | 1\nGambler's Fallacy | 3 | 3";};

  init();
</script>
</body>
</html>
